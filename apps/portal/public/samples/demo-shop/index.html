<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>데모 쇼핑몰</title>
<!--
  웹 품질 진단 데모용 샘플 페이지입니다.
  일부러 웹접근성·웹표준 문제를 넣어 두었습니다. 실제 서비스가 아닙니다.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; }
  .top { background: #f5f5f5; padding: 12px 20px; }
  .notice { color: #aaa; font-size: 12px; }
  .card { border: 1px solid #ddd; padding: 16px; margin: 16px 20px; }
  .icon-btn { width: 32px; height: 32px; border: 1px solid #999; background: #fff; }
</style>
</head>
<body>
<div class="top">
  <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='32'><rect width='120' height='32' fill='%232563eb'/></svg>">
  <span class="notice">이 페이지는 웹 품질 진단 데모용 샘플입니다 (일부러 문제를 넣었습니다)</span>
</div>

<div class="card">
  <font size="5"><b>이번 주 특가</b></font>
  <p>인기 상품을 최대 30% 할인합니다. 자세한 내용은 <a href="#" style="color:#222;text-decoration:none">여기</a>를 누르세요.</p>
  <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><rect width='200' height='120' fill='%23e2e8f0'/></svg>">
  <button class="icon-btn"></button>
</div>

<div class="card">
  <b>회원 로그인</b><br>
  <input type="text" placeholder="아이디">
  <input type="password">
  <div onclick="alert('로그인')" style="display:inline-block;padding:6px 12px;background:#2563eb;color:#93c5fd">로그인</div>
</div>

<div class="card">
  <table border="1">
    <tr><td>상품명</td><td>가격</td></tr>
    <tr><td>무선 이어폰</td><td>39,000원</td></tr>
    <tr><td>보조 배터리</td><td>19,000원</td></tr>
  </table>
</div>

<div class="card">
  <center><marquee>회원가입 시 5,000원 쿠폰 증정!</marquee></center>
  <div id="dup">공지 1</div>
  <div id="dup">공지 2</div>
</div>
</body>
</html>
